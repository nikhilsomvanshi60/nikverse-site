    <!-- viewport-fit=cover: content notch ke neeche tak jata hai (native feel).
         user-scalable=no: do ungli se zoom band — warna app "website" lagti hai. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />

    <title>NIK Remote</title>
    <meta name="description" content="The remote for NIK AI on your PC — talk to it from anywhere." />

    <!-- App login ke peeche hai, is liye Google ise index na kare.
         SEO ka poora kaam nikai.com karti hai. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Android Chrome ka address bar isi rang ka ho jata hai -->
    <meta name="theme-color" content="#000000" />

    <!-- iOS ke apne tags — inke baghair iPhone par "Add to Home Screen"
         fullscreen nahi chalta, Safari ka bar upar chipka rehta hai. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NIK Remote" />
